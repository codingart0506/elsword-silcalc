<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엘소드 실투력 계산기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233182F6%22/%3E%3Cpath d=%22M9 20 L14 14 L18 17 L23 10%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>실투력 계산기</h1>
    <div class="who">
      <label class="sr" for="profileSel">캐릭터</label>
      <select id="profileSel" class="pill"></select>
      <button class="txt" id="btnNew">추가</button>
      <button class="txt mute" id="btnDelete" hidden>삭제</button>
    </div>
  </header>

  <section class="card hero" aria-live="polite">
    <div class="hero-top">
      <span class="hero-label">실질 전투력</span>
      <span class="hero-class" id="rClass"></span>
    </div>
    <div class="hero-value" id="rCP">-</div>
    <div class="hero-unit" id="rCPk"></div>
    <div class="delta" id="delta">
      <span class="delta-text" id="deltaText"></span>
      <span class="delta-acts">
        <button class="txt sm" id="btnPin">이 값을 기준으로</button>
        <button class="txt sm mute" id="btnRevert">기준으로 되돌리기</button>
      </span>
    </div>
  </section>

  <section class="card" id="ocrCard" aria-labelledby="ocrTitle">
    <h2 id="ocrTitle">스크린샷으로 채우기</h2>
    <div class="drop" id="dropZone">
      <p class="drop-main">상세 스탯 창을 띄우고 <kbd>PrtSc</kbd> 누른 뒤<br>여기서 <kbd>Ctrl</kbd> + <kbd>V</kbd></p>
      <p class="drop-sub">장비창이 같이 찍히면 전직·악세서리도 채워요</p>
      <div class="drop-btns">
        <button class="btn primary" id="btnShare">화면 공유로 캡처</button>
        <button class="btn primary" id="btnGrab" hidden>지금 캡처</button>
        <button class="btn" id="btnStop" hidden>공유 끝내기</button>
        <label class="btn" for="fileIn">이미지 열기</label>
        <input id="fileIn" type="file" accept="image/*" hidden>
      </div>
    </div>
    <p class="note" id="shareMsg" hidden></p>
    <div class="stage" id="stage" hidden>
      <div class="stage-inner">
        <canvas id="shot"></canvas>
        <div class="sel" id="sel" hidden></div>
      </div>
      <div class="stage-bar">
        <button class="txt sm mute" id="btnSelAll">영역 다시 고르기</button>
        <button class="btn primary wide" id="btnOcr">읽기</button>
      </div>
      <div class="progress" id="ocrProg" hidden><div class="bar"></div><span class="ptext"></span></div>
    </div>
    <div class="ocr-result" id="ocrResult" hidden>
      <p class="ocr-count" id="ocrCount"></p>
      <table class="ocr-table">
        <thead class="sr"><tr><th>적용</th><th>항목</th><th>지금</th><th>읽은 값</th></tr></thead>
        <tbody id="ocrBody"></tbody>
      </table>
      <div class="ocr-actions">
        <button class="txt sm mute" id="btnOcrAll">전체 선택</button>
        <button class="btn primary wide" id="btnApply">선택한 값 적용</button>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="inTitle">
    <div class="in-head">
      <h2 id="inTitle">세팅</h2>
      <div class="class-pick"><label for="in-C6">전직</label><span id="classSlot"></span></div>
    </div>
    <div class="seg" role="tablist" id="tabs"></div>
    <div id="forms"></div>
  </section>

  <footer class="foot">
    <p>계산식은 [실질전투력] Actual Combat Power 시트(제작: 마음담은편지)의 수식을 그대로 사용했습니다. 문의와 제보는 <a href="https://discord.gg/A3BJHhWuMZ" target="_blank" rel="noopener">시트 디스코드</a>로 부탁드립니다.</p>
    <p id="selfTest"></p>
    <p>이 사이트는 KOG·넥슨과 관련 없는 비공식 팬 도구입니다. 입력한 값은 이 브라우저에만 저장됩니다.</p>
  </footer>
</div>

<div class="dialog" id="dialog" hidden>
  <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <input id="dlgInput" type="text" hidden>
    <textarea id="dlgArea" rows="5" hidden></textarea>
    <div class="dlg-actions">
      <button class="btn" id="dlgCancel">취소</button>
      <button class="btn primary" id="dlgOk">확인</button>
    </div>
  </div>
</div>

<script>window.SIL_CDN = true;</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script src="engine.js"></script>
<script src="model.js"></script>
<script src="ocr.js"></script>
<script src="icons.js"></script>
<script src="gear.js"></script>
<script src="app.js"></script>
</body>
</html>
